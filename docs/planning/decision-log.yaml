- id: DEC-0006
  title: Team competition is primary; server-authoritative, auditable scoring
  kind: architecture
  status: approved
  ratified: false
  decided_at: '2026-10-27'
  decided_by: [project-owners]
  source: {brief: 'Approved product direction 2026-10-27 §2C', hub: D24}
  outcome: "Team seasons with normalized team scores; individual participation and personal growth; two difficulty levels; approved alternates; one or two non-workout missions a week; immutable ledger with corrective entries; rule versioning; season finalization; review and appeal."
  rationale: Stated as approved direction by the owners. Scoring must not reward unsafe exercise, dishonesty, excessive training, restriction or disclosure of spiritual information.
