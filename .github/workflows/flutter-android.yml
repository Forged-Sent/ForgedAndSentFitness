name: Flutter Android CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Android host (temporary)
        working-directory: mobile
        run: flutter create --platforms=android --project-name=forged_and_sent --org=com.forgedandsent .
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: Widget tests
        working-directory: mobile
        run: flutter test --no-pub
      - name: Build unsigned Android debug APK
        working-directory: mobile
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK for reviewers
        uses: actions/upload-artifact@v4
        with:
          name: forged-sent-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 5
          if-no-files-found: error
