<title>Roll Call</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. Today's checklist first, standings under it, task management last (editors only). */
:root {
  --bg: #eff1ec;
  --surface: #f8f9f6;
  --ink: #17201c;
  --muted: #5c6a63;
  --line: #d3d9d1;
  --accent: #1f6f4f;
  --accent-ink: #f8f9f6;
  --hot: #c2410c;
  --danger: #b42318;
  --f-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111714; --surface: #19211d; --ink: #e8ede9; --muted: #93a39a; --line: #2b3832;
    --accent: #4cc38a; --accent-ink: #0d1411; --hot: #f08a4b; --danger: #f2877d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111714; --surface: #19211d; --ink: #e8ede9; --muted: #93a39a; --line: #2b3832;
  --accent: #4cc38a; --accent-ink: #0d1411; --hot: #f08a4b; --danger: #f2877d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-family: var(--f-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 46px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.tally { font-family: var(--f-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.meter > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

ul { list-style: none; margin: 0; padding: 0; }
.tasks { display: flex; flex-direction: column; gap: 8px; }
.task { display: flex; align-items: center; gap: 8px; }
.check {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-align: left;
  min-height: 56px; padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
}
.check:disabled { cursor: default; opacity: .7; }
.box {
  flex: none; width: 28px; height: 28px; border: 2px solid var(--muted); border-radius: 6px;
  display: grid; place-items: center; transition: background .12s, border-color .12s;
}
.box svg { width: 16px; height: 16px; stroke: var(--accent-ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check[aria-checked="true"] { border-color: var(--accent); }
.check[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.check[aria-checked="true"] .box svg { opacity: 1; }
.check[aria-checked="true"] .label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.label { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.pts { flex: none; font-family: var(--f-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.done-banner { margin-top: 12px; font-family: var(--f-display); font-size: 18px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.empty { padding: 20px 16px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { background: transparent; border: 0; padding: 6px 14px; font-family: var(--f-data); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.board { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 28px 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rank { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.lead .rank { color: var(--hot); }
.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--line); }
.who { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name em { font-style: normal; font-family: var(--f-data); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-left: 6px; font-weight: 400; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.row.lead .bar > i { background: var(--hot); }
.score { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.score b { display: block; font-size: 20px; font-weight: 500; line-height: 1.1; }
.score span { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

.manage form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.manage input[type="text"], .manage input[type="number"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; }
.manage input[type="text"] { flex: 1 1 200px; min-width: 0; }
.manage input[type="number"] { width: 84px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.mini { min-height: 56px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; }
.confirm { display: flex; gap: 6px; }
.confirm .mini { min-height: 56px; }
.error { color: var(--danger); font-size: 14px; margin: 0 0 8px; }

@media (prefers-reduced-motion: reduce) { .meter > i, .box { transition: none; } }
@media (max-width: 380px) { h1 { font-size: 40px; } .row { gap: 10px; } }
</style>

<main>
  <header>
    <div class="eyebrow" id="today-label">&nbsp;</div>
    <h1>Roll Call</h1>
  </header>

  <section aria-labelledby="h-today">
    <div class="section-head">
      <h2 id="h-today">Today</h2>
      <span class="tally" id="my-tally"></span>
    </div>
    <div class="meter" aria-hidden="true"><i id="my-meter"></i></div>
    <div id="notice"></div>
    <ul class="tasks" id="tasks"></ul>
    <div class="done-banner" id="banner" hidden>All tasks done for today</div>
  </section>

  <section aria-labelledby="h-board">
    <div class="section-head">
      <h2 id="h-board">Standings</h2>
      <div class="tabs" role="group" aria-label="Standings range">
        <button type="button" id="tab-today" aria-pressed="false">Today</button>
        <button type="button" id="tab-week" aria-pressed="true">This week</button>
      </div>
    </div>
    <div class="board" id="board"></div>
    <p class="note" id="board-note" style="margin-top:10px"></p>
  </section>

  <section class="manage" id="manage" aria-labelledby="h-manage" hidden>
    <div class="section-head"><h2 id="h-manage">Edit checklist</h2></div>
    <form id="add-form">
      <input type="text" id="new-title" placeholder="New daily task" maxlength="80" aria-label="Task name" required>
      <input type="number" id="new-points" value="1" min="1" max="10" aria-label="Points">
      <button class="btn" type="submit">Add task</button>
    </form>
    <p class="error" id="manage-error" hidden></p>
    <ul class="tasks" id="manage-list"></ul>
  </section>
</main>

<script>
(function () {
  var state = { tasks: [], checks: [], range: "week", me: null, canWrite: true, canManage: false, profs: {}, confirmId: null };
  var db = null, user = null, unsubWeek = null, subscribedWeek = null;
  var writeChain = Promise.resolve();

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dkey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayKey() { return dkey(new Date()); }
  function weekStartKey() {
    var d = new Date(); var dow = (d.getDay() + 6) % 7; // Monday = 0
    d.setDate(d.getDate() - dow); return dkey(d);
  }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var CHECK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';

  function myDoc() {
    var t = todayKey();
    for (var i = 0; i < state.checks.length; i++) {
      var c = state.checks[i];
      if (c.date === t && c.uid === state.me) return c;
    }
    return { date: t, uid: state.me, done: {} };
  }
  function countDone(done) {
    var n = 0; state.tasks.forEach(function (t) { if (done && done[t.id]) n++; }); return n;
  }
  function pointsFor(done) {
    var p = 0; state.tasks.forEach(function (t) { if (done && done[t.id]) p += t.points; }); return p;
  }

  function toggle(taskId) {
    if (!db || !state.me) return;
    var date = todayKey(), uid = state.me;
    var cur = myDoc();
    var done = {}; Object.keys(cur.done || {}).forEach(function (k) { done[k] = true; });
    if (done[taskId]) delete done[taskId]; else done[taskId] = true;
    // optimistic update, then serialized write
    var found = false;
    state.checks = state.checks.map(function (c) {
      if (c.date === date && c.uid === uid) { found = true; return { date: date, uid: uid, done: done }; }
      return c;
    });
    if (!found) state.checks.push({ date: date, uid: uid, done: done });
    draw();
    writeChain = writeChain.then(function () {
      return db.doc("checkins/" + date + "_" + uid).set({ date: date, uid: uid, done: done });
    }).catch(function (e) {
      if (e && e.code === "invalid_argument") { state.canWrite = false; }
      draw();
    });
  }

  function drawToday() {
    var list = $("tasks"); list.textContent = "";
    var notice = $("notice"); notice.textContent = "";
    var tasks = state.tasks;
    var done = myDoc().done || {};
    var n = countDone(done);
    $("my-tally").textContent = tasks.length ? n + " of " + tasks.length + " done · " + pointsFor(done) + " pts" : "";
    $("my-meter").style.width = tasks.length ? Math.round(100 * n / tasks.length) + "%" : "0%";
    $("banner").hidden = !(tasks.length && n === tasks.length);

    if (!state.me) notice.appendChild(el("p", "note", "Sign in to claude.ai to check off tasks and appear in the standings."));
    else if (!state.canWrite) notice.appendChild(el("p", "note", "You have view-only access. Ask the owner for Contributor access to check off tasks."));

    if (!tasks.length) {
      var e = el("div", "empty");
      e.appendChild(el("strong", null, "No tasks yet"));
      e.appendChild(document.createTextNode(state.canManage ? "Add the first daily task under Edit checklist." : "The owner has not added daily tasks yet."));
      list.appendChild(e);
      return;
    }
    tasks.forEach(function (t) {
      var li = el("li", "task");
      var b = el("button", "check"); b.type = "button";
      b.setAttribute("role", "checkbox");
      b.setAttribute("aria-checked", done[t.id] ? "true" : "false");
      b.disabled = !state.me || !state.canWrite;
      var box = el("span", "box"); box.innerHTML = CHECK_SVG;
      b.appendChild(box);
      b.appendChild(el("span", "label", t.title));
      b.appendChild(el("span", "pts", "+" + t.points));
      b.addEventListener("click", function () { toggle(t.id); });
      li.appendChild(b); list.appendChild(li);
    });
  }

  function drawBoard() {
    var board = $("board"); board.textContent = "";
    var today = todayKey(), weekStart = weekStartKey();
    var people = {};
    if (state.me) people[state.me] = { id: state.me, todayDone: 0, todayPts: 0, weekPts: 0 };
    state.checks.forEach(function (c) {
      if (c.date < weekStart) return;
      var p = people[c.uid] || (people[c.uid] = { id: c.uid, todayDone: 0, todayPts: 0, weekPts: 0 });
      p.weekPts += pointsFor(c.done);
      if (c.date === today) { p.todayDone = countDone(c.done); p.todayPts = pointsFor(c.done); }
    });
    var arr = Object.keys(people).map(function (k) { return people[k]; });
    var isWeek = state.range === "week";
    arr.sort(function (a, b) {
      var d = isWeek ? b.weekPts - a.weekPts : b.todayPts - a.todayPts;
      return d || (isWeek ? b.todayPts - a.todayPts : b.weekPts - a.weekPts);
    });
    $("tab-today").setAttribute("aria-pressed", String(!isWeek));
    $("tab-week").setAttribute("aria-pressed", String(isWeek));
    $("board-note").textContent = isWeek ? "Week runs Monday to Sunday. Points come from each task's value." : "Resets at midnight.";

    if (!arr.length || (!state.tasks.length)) {
      var e = el("div", "empty");
      e.appendChild(el("strong", null, "No standings yet"));
      e.appendChild(document.createTextNode("Standings appear once there are tasks and someone checks one off."));
      board.appendChild(e); return;
    }
    var max = 0; arr.forEach(function (p) { var v = isWeek ? p.weekPts : p.todayPts; if (v > max) max = v; });
    var lead = isWeek ? arr[0].weekPts : arr[0].todayPts;
    var prevScore = null, rank = 0;
    arr.forEach(function (p, i) {
      var score = isWeek ? p.weekPts : p.todayPts;
      if (score !== prevScore) { rank = i + 1; prevScore = score; }
      var prof = state.profs[p.id] || {};
      var row = el("div", "row" + (rank === 1 && lead > 0 ? " lead" : ""));
      row.appendChild(el("div", "rank", String(rank)));
      var img = el("img", "avatar"); img.alt = ""; if (prof.avatarUrl) img.src = prof.avatarUrl;
      row.appendChild(img);
      var who = el("div", "who");
      var nm = el("div", "name", prof.name || "Someone");
      if (p.id === state.me) nm.appendChild(el("em", null, "you"));
      who.appendChild(nm);
      var bar = el("div", "bar"); var fill = el("i"); fill.style.width = max ? Math.round(100 * score / max) + "%" : "0%"; bar.appendChild(fill);
      who.appendChild(bar);
      row.appendChild(who);
      var sc = el("div", "score");
      sc.appendChild(el("b", null, String(score)));
      sc.appendChild(el("span", null, isWeek ? "pts" : p.todayDone + "/" + state.tasks.length + " done"));
      row.appendChild(sc);
      board.appendChild(row);
    });
  }

  function drawManage() {
    $("manage").hidden = !state.canManage;
    if (!state.canManage) return;
    var list = $("manage-list"); list.textContent = "";
    state.tasks.forEach(function (t) {
      var li = el("li", "task");
      var card = el("div", "check"); card.style.cursor = "default";
      card.appendChild(el("span", "label", t.title));
      card.appendChild(el("span", "pts", "+" + t.points));
      li.appendChild(card);
      if (state.confirmId === t.id) {
        var c = el("div", "confirm");
        var yes = el("button", "mini btn danger", "Delete"); yes.type = "button";
        var no = el("button", "mini", "Keep"); no.type = "button";
        yes.addEventListener("click", function () {
          state.confirmId = null;
          db.doc("tasks/" + t.id).delete().catch(function () { showManageError("Could not delete the task. Try again."); });
        });
        no.addEventListener("click", function () { state.confirmId = null; draw(); });
        c.appendChild(yes); c.appendChild(no); li.appendChild(c);
      } else {
        var del = el("button", "mini", "Remove"); del.type = "button";
        del.setAttribute("aria-label", "Remove " + t.title);
        del.addEventListener("click", function () { state.confirmId = t.id; draw(); });
        li.appendChild(del);
      }
      list.appendChild(li);
    });
  }
  function showManageError(msg) { var e = $("manage-error"); e.textContent = msg; e.hidden = !msg; }

  function draw() {
    var d = new Date();
    $("today-label").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    drawToday(); drawBoard(); drawManage();
  }

  async function loadProfiles() {
    var ids = {}; state.checks.forEach(function (c) { ids[c.uid] = true; }); if (state.me) ids[state.me] = true;
    var list = Object.keys(ids);
    if (!user || !list.length) return;
    try { state.profs = await user.profiles(list); draw(); } catch (e) {}
  }

  function subscribeWeek() {
    var ws = weekStartKey();
    if (subscribedWeek === ws) return;
    if (unsubWeek) unsubWeek();
    subscribedWeek = ws;
    unsubWeek = db.collection("checkins").where("date", ">=", ws).onSnapshot(function (snap) {
      state.checks = snap.docs.map(function (d) { var x = d.data() || {}; return { date: x.date, uid: x.uid, done: x.done || {} }; });
      draw(); loadProfiles();
    }, function () {});
  }

  async function start() {
    $("tab-today").addEventListener("click", function () { state.range = "today"; draw(); });
    $("tab-week").addEventListener("click", function () { state.range = "week"; draw(); });
    $("add-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var title = $("new-title").value.trim();
      var pts = Math.max(1, Math.min(10, parseInt($("new-points").value, 10) || 1));
      if (!title || !db) return;
      showManageError("");
      db.collection("tasks").add({ title: title, points: pts, createdAt: Date.now() }).then(function () {
        $("new-title").value = ""; $("new-points").value = "1"; $("new-title").focus();
      }).catch(function () { showManageError("Could not add the task. Try again."); });
    });
    draw();

    var claude = window.claude;
    if (!claude || !claude.use) return;
    db = await claude.use("db");
    user = await claude.use("user");
    if (user) {
      try { state.me = await user.id(); } catch (e) {}
      try { state.canManage = await user.canEdit(); } catch (e) {}
      try { var cw = await user.can("data.write"); state.canWrite = cw !== false; } catch (e) {}
    }
    if (!db) { draw(); return; }
    db.collection("tasks").orderBy("createdAt").onSnapshot(function (snap) {
      state.tasks = snap.docs.map(function (d) {
        var x = d.data() || {};
        return { id: d.id, title: String(x.title || ""), points: Number(x.points) > 0 ? Number(x.points) : 1 };
      });
      draw();
    }, function () {});
    subscribeWeek();
    draw(); loadProfiles();
    setInterval(function () { subscribeWeek(); draw(); }, 60000);
  }
  start();
})();
</script>
