# Optional project MCP servers; not auto-loaded.
# Review provider permissions and prerequisites before opting in.

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/readonly"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.maestro]
command = "node"
args = ["tooling/mcp/launch.mjs", "maestro"]
startup_timeout_sec = 60
